<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solid to SCAD</title>
  <meta name="description" content="Turn STL files into one parametric OpenSCAD file for MakerWorld's Parametric Model Maker.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "manifold-3d": "./vendor/manifold/manifold.js"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>Solid to SCAD</h1>
      <p>STL files in, one parametric <code>.scad</code> out. <button type="button" class="tip" aria-label="More info" aria-expanded="false" data-tip="Made for MakerWorld's Parametric Model Maker, so people can resize your model themselves. Runs in your browser: your files never leave your computer.">?</button></p>
    </div>
    <a class="back" href="../projects/">← Projects</a>
  </header>
  <main>
    <aside id="panel">
      <section>
        <h2>1. Default model <button type="button" class="tip" aria-label="More info" aria-expanded="false" data-tip="Export the model at its default values. Each STL file becomes one part, and a file can hold several bodies.">?</button></h2>
        <label class="drop" id="drop">
          <input type="file" id="files" accept=".stl" multiple hidden>
          <span>Drop STL files here or <u>choose files</u></span>
        </label>
        <ul id="parts"></ul>
      </section>
      <section id="params-section" hidden>
        <h2>2. Values <button type="button" class="tip" aria-label="More info" aria-expanded="false" data-tip="For each value people should be able to change, export the model again with only that value changed and add those files here. The app compares the two exports to work out what the value moves.">?</button></h2>
        <div id="params"></div>
        <button type="button" id="add-param" class="secondary">+ Add a value</button>
      </section>
      <section id="export-section" hidden>
        <h2>3. Export</h2>
        <label class="row">Title <input id="title" type="text" value=""></label>
        <button type="button" id="export" class="primary">Download .scad</button>
        <div id="export-msgs"></div>
        <p class="hint" id="export-info"></p>
      </section>
    </aside>
    <section id="view">
      <div id="status" role="status"></div>
      <div id="empty">Add STL files to start.</div>
    </section>
  </main>
  <script src="https://buddieh.github.io/hub.js" defer></script>
</body>
</html>
